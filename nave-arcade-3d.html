let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;TT+=dt;
const cine=G.estado=='mapa'||G.estado=='lancamento'||G.estado=='pouso'||(G.estado=='loja'&&G.entre);

let tA=0,tD=0;
addEventListener('keydown',e=>{au();const k=e.key.toLowerCase();K[k]=1;if(k==' '||k.startsWith('arrow')||k=='a'||k=='d'||k=='w'||k=='s')e.preventDefault();if(e.repeat)return;const now=performance.now();if(k=='a'){if(now-tA<280)tryDash(-1);tA=now}if(k=='d'){if(now-tD<280)tryDash(1);tD=now}if(k=='f')especial();if(k=='r')laserBtn();if(k=='p'||k=='escape')pausa();if(k=='m')mute=!mute});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=0});

addEventListener('mousemove',e=>{if(document.pointerLockElement==$('c')){mx+=e.movementX;my+=e.movementY}});
let firePtr=null;

addEventListener('pointerup',fireOff);addEventListener('pointercancel',fireOff);
const joy=$('joy'),kn=$('knob');let jid=null;
function jm(e){const r=joy.getBoundingClientRect(),h=r.width/2;let dx=e.clientX-r.left-h,dy=e.clientY-r.top-h;const l=Math.hypot(dx,dy),m=h*.8;if(l>m){dx*=m/l;dy*=m/l}jx=dx/m;jy=-dy/m;kn.style.transform=`translate(${dx}px,${dy}px)`}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId==jid)jm(e)});
const je=e=>{if(e.pointerId==jid){jid=null;jx=jy=0;kn.style.transform=''}};joy.addEventListener('pointerup',je);joy.addEventListener('pointercancel',je);
function hold(id,set){const b=$(id);const on=e=>{e.preventDefault();e.stopPropagation();set(1);try{b.setPointerCapture(e.pointerId)}catch(err){}};const off=()=>set(0);b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off)}
hold('bacel',v=>acelH=v);hold('bfreio',v=>freioH=v);hold('bdrift',v=>driftH=v);hold('bfire',v=>fireH=v);
$('bdash').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();tryDash(jx<-.25?-1:1)});
